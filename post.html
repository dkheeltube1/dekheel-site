<body>
  <h1>Post Photo to TikTok</h1>

  <p>
    This page demonstrates how our website sends a photo post request to our n8n workflow,
    which then publishes the photo to TikTok through the TikTok Content Posting API.
  </p>

  <form>
    <label>Image URL</label><br>
    <input
      type="url"
      value="https://dkheeltube1.github.io/dekheel-site/images/post1.jpg"
      style="width: 500px;"
    >
    <br><br>

    <label>Caption</label><br>
    <textarea rows="4" cols="60">Premier League update</textarea>
    <br><br>

    <button type="button">Post Photo to TikTok</button>
  </form>

  <p>
    Backend: n8n workflow using TikTok Content Posting API.
  </p>
